name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run all checks
        run: just check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run clippy
        run: just lint

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Check formatting
        run: just fmt-check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Check documentation
        run: cargo doc --no-deps --all-features
  library-features:
    name: Library feature boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check minimal and SQLite-only modes
        run: |
          cargo check --locked --lib --no-default-features
          cargo check --locked -p octofhir-canonical-core --no-default-features
          cargo test --locked -p octofhir-canonical-core --no-default-features --features sqlite
          cargo clippy --locked -p octofhir-canonical-core --no-default-features --all-targets -- -D warnings
          cargo check --locked --no-default-features --features sqlite
      - name: Reject CLI support in library dependencies
        shell: bash
        run: |
          cargo tree --locked --no-default-features --features sqlite --edges normal,build --prefix none > library-deps.txt
          if grep -E '^(clap|human-panic|tracing-subscriber|colored) v' library-deps.txt; then
            echo "CLI dependencies leaked into the library"
            exit 1
          fi

      - name: Reject HTTP and TLS in offline core
        shell: bash
        run: |
          cargo tree --locked -p octofhir-canonical-core --no-default-features --edges normal,build --prefix none > offline-deps.txt
          if grep -E '^(reqwest|hyper|hyper-util|rustls|native-tls|openssl|clap|human-panic) v' offline-deps.txt; then
            echo "Transport or CLI dependencies leaked into offline core"
            exit 1
          fi
