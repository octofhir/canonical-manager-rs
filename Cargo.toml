[package]
name = "octofhir-canonical-manager"
version = "0.2.12"
edition = "2024"
description = "FHIR Canonical Manager - Library-first FHIR package management"
license = "MIT OR Apache-2.0"
authors = ["OctoFHIR Team <funyloony@gmail.com"]
repository = "https://github.com/octofhir/canonical-manager-rs"
keywords = ["fhir", "healthcare", "canonical", "package-manager"]
categories = ["science", "web-programming", "command-line-utilities"]
exclude = ["CLAUDE.md", ".github/", "rust-toolchain.toml"]

[lib]
name = "octofhir_canonical_manager"
path = "src/lib.rs"

[[bin]]
name = "octofhir-fcm"
path = "src/bin/main.rs"
required-features = ["cli"]

[[example]]
name = "search_parameters"
path = "examples/search_parameters.rs"

[dependencies]
octofhir-canonical-core = { path = "core", version = "=0.2.12", default-features = false, features = ["http"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
human-panic = { version = "2.0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.0"
wiremock = "0.6"
criterion = { version = "0.8.2", features = ["async_tokio"] }
proptest = "1.5"


reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"
serde_json = "1.0"
toml = "0.9"
sha1 = "0.11"
hex = "0.4"
sha2 = "0.11"
base64 = "0.23"
flate2 = "1"
tar = "0.4.45"
url = { version = "2.5", features = ["serde"] }
walkdir = "2.5"
[[bench]]
name = "cas"
harness = false

[[bench]]
name = "lockfile"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "linker"
harness = false

[[bench]]
name = "install"
harness = false

[[bench]]
name = "disk_usage"
harness = false

[[bench]]
name = "durable_writes"
harness = false

[[bench]]
name = "tar_extract"
harness = false

[[bench]]
name = "download_parallelism"
harness = false

[features]
default = ["cli"]
sqlite = ["octofhir-canonical-core/sqlite"]
cli = ["sqlite", "octofhir-canonical-core/cli", "dep:tokio", "dep:human-panic"]
fuzzy-search = ["octofhir-canonical-core/fuzzy-search"]
metrics = ["octofhir-canonical-core/metrics"]
test-utils = ["octofhir-canonical-core/test-utils"]

[workspace]
resolver = "3"
members = ["core"]
