name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm'
        required: true
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish core and compatibility facade
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Run all checks
        run: just prepare-publish
      - name: Verify offline core package
        run: cargo package --locked -p octofhir-canonical-core
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish --locked -p octofhir-canonical-core
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "octofhir-canonical-core") | .version')
          for attempt in $(seq 1 18); do
            if curl --fail --silent "https://index.crates.io/oc/to/octofhir-canonical-core" | jq -e --arg version "$version" 'select(.vers == $version)' > /dev/null; then
              break
            fi
            sleep 10
          done
          cargo package --locked -p octofhir-canonical-manager
          cargo publish --locked -p octofhir-canonical-manager
